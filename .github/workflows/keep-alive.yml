name: Supabase Keep-Alive

on:
  schedule:
    # Se ejecuta todos los lunes y jueves a las 10:00 UTC
    - cron: '0 10 * * 1,4'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        run: |
          curl -s -X GET "https://ebgmjcfobcngdfwlptwe.supabase.co/rest/v1/productos?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"